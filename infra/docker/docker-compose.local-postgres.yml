# Postgres de développement — POS Eau Cascade UNIQUEMENT.
# Projet Compose explicite pour NE PAS écraser Israel / Frères Baziles.
#
# Usage :
#   docker compose -f infra/docker/docker-compose.local-postgres.yml up -d
#   apps/backend/.env → DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5434/pos_eau_cascade?schema=public
#
# Autres tenants typiques :
#   Israel  → port 5433, DB pos_israel
#   Frères  → port 5432, DB pos_db

name: pos-eau-cascade

services:
  postgres:
    image: postgres:16
    container_name: pos_eau_cascade_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pos_eau_cascade
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_eau_cascade:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos_eau_cascade"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_eau_cascade:
    name: docker_postgres_data_eau_cascade
