# Build desktop Remote, generate latest.yml, upload to GCS installers/remote/.
# EAU CASCADE ONLY — never point this workflow at Israel or Frères Baziles.
#
# Secrets: GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
# Variables: GCP_REGION

name: Desktop - release to GCS

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Flavor desktop'
        required: true
        default: remote
        type: choice
        options:
          - remote
          - server
  push:
    tags:
      - 'desktop-v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Resolve edition
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "edition=${{ inputs.edition }}" >> "$GITHUB_OUTPUT"
          else
            echo "edition=remote" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Windows installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $edition = '${{ steps.meta.outputs.edition }}'
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            Write-Host "Build attempt $i/$max (edition=$edition)"
            npm run "dist:win:$edition"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -eq $max) { throw "dist:win:$edition failed after $max attempts" }
            Write-Warning "Build failed (exit $LASTEXITCODE) — retry in 15s (NSIS/Electron download flake)"
            Start-Sleep -Seconds 15
          }

      - name: Authenticate to Google Cloud (WIF — Eau Cascade)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to GCS
        shell: pwsh
        run: |
          $edition = '${{ steps.meta.outputs.edition }}'
          if ('${{ secrets.GCP_PROJECT_ID }}' -match 'freres|bazile') { throw 'ABORT: Freres Baziles project forbidden' }
          & ./infra/scripts/upload-desktop-installer.ps1 -Edition $edition
